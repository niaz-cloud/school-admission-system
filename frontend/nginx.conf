server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is rewritten at container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Fingerprinted bundles can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links such as /holds/h_... must survive a page refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
